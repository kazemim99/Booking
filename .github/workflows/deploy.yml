name: Deploy to Production

on:
  # Every push to master deploys (tests -> images -> self-hosted deploy on the box).
  # Feature branches never deploy: merge or push to master to go live.
  push:
    branches: [ "master" ]
    # A documentation-only push changes nothing that runs on the server, so it does not
    # redeploy. A push that touches any other file (code, config, this workflow) does.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './Booksy.sln'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/booksy

jobs:
  # Run all tests before deploying
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booksy_admin
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: booksy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksy_admin -d booksy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run Unit Tests
      run: |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~UnitTests" \
          --verbosity normal

    # Integration test projects still target the retired per-service hosts; re-enable
    # once they're retargeted to Booksy.Host (tracked in COMPLETION_ROADMAP Epic 3.1).
    # The keystone E2E job below covers the integration-level happy path in the meantime.
    # - name: Run Integration Tests
    #   env:
    #     ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=booksy_test;Username=booksy_admin;Password=TestPassword123!;Include Error Detail=true"
    #     ConnectionStrings__Redis: "localhost:6379"
    #   run: |
    #     dotnet test ${{ env.SOLUTION_PATH }} \
    #       --configuration Release \
    #       --no-build \
    #       --filter "FullyQualifiedName~IntegrationTests" \
    #       --verbosity normal

  # Keystone end-to-end smoke test: boot the real monolith host against ephemeral
  # Postgres+Redis and exercise the core flow (provider onboard → staff → customer
  # books) before building/​deploying to production.
  e2e-keystone:
    name: Keystone E2E Smoke
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booksy_admin
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: booksy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksy_admin -d booksy_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Start Booksy host (sandbox auth, no real SMS)
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://localhost:5050
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=booksy_e2e;Username=booksy_admin;Password=TestPassword123!;Include Error Detail=true"
        ConnectionStrings__Redis: "localhost:6379"
        EventBus__Provider: "InMemory"
        OTP_SANDBOX_CODE: "123456"
        Sms__SandboxMode: "true"
        # Program.cs defaults Database:SeedOnStartup to IsDevelopment() when unset, and this job
        # sets ASPNETCORE_ENVIRONMENT=Development -- so without this override the host reseeds
        # the full province/city reference dataset (thousands of rows) into a brand-new ephemeral
        # Postgres container on every run, which alone takes longer than the 240s health-check
        # window below. keystone-booking-flow.sh never reads that data (it posts plain city/state
        # strings, not seeded IDs), so there is nothing to lose by skipping it here.
        Database__SeedOnStartup: "false"
        # Province/city reference data has its own switch (default true, for production).
        # SeedOnStartup=false no longer covers it, so it must be turned off explicitly here or
        # this job goes back to reseeding thousands of rows before the health window closes.
        Database__SeedReferenceData: "false"
        # Same reason appsettings.Testing.json turns this off for the integration suite: the named
        # "otp"/"phone-verification" policies allow 5 requests per 300s, partitioned by caller IP —
        # and every call in CI comes from 127.0.0.1, so they all share one bucket. A clean run
        # spends 3 of those 5 on OTP logins; one retry would exhaust it and fail the job on a
        # 429 that has nothing to do with the booking flow this smoke test exists to prove.
        RateLimiting__Enabled: "false"
      run: |
        # --no-launch-profile is load-bearing: Properties/launchSettings.json pins
        # applicationUrl to http://localhost:5000, and `dotnet run` applies that launch profile
        # by default, overriding the ASPNETCORE_URLS=5050 set above. Without this flag the host
        # listens on 5000 while the health check below polls 5050, so the wait loop could never
        # succeed and this job always timed out after its full 240s.
        dotnet run --project src/Host/Booksy.Host/Booksy.Host.csproj --configuration Release --no-launch-profile > host.log 2>&1 &
        echo $! > host.pid

    - name: Wait for host to become healthy
      run: |
        for i in $(seq 1 80); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5050/health || echo 000)
          if [ "$code" = "200" ]; then echo "Host healthy after ~$((i*3))s"; exit 0; fi
          sleep 3
        done
        echo "Host did not become healthy in time"; tail -n 200 host.log; exit 1

    - name: Run keystone booking flow
      run: BASE=http://localhost:5050 bash tests/e2e/keystone-booking-flow.sh

    - name: Dump host log on failure
      if: failure()
      run: tail -n 300 host.log || true

  # Build the modular-monolith API (single image replacing usermanagement + servicecatalog + gateway)
  build-api:
    name: Build Booksy API (monolith)
    runs-on: ubuntu-latest
    needs: [test, e2e-keystone]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Booksy API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Host/Booksy.Host/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Build Frontend (parallel job 4)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, e2e-keystone]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: booksy-frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: booksy-frontend
      run: npm ci

    - name: Build frontend
      working-directory: booksy-frontend
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        # Repo root, not booksy-frontend/: src/main.ts imports the shared token sheet
        # at ../../packages/design-tokens/tokens.css, which is outside that directory.
        # A narrower context leaves it out and the image build cannot resolve the import.
        context: .
        file: ./booksy-frontend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Provider app (Flutter web), served by host nginx from /var/www/booksy-provider on the box.
  # Built here on a GitHub-hosted runner; the deploy job below publishes the artifact.
  build-provider-web:
    name: Build Provider App (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booksy-provider-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Keep in step with the version the app is developed and verified on.
        flutter-version: '3.44.2'
        channel: stable
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    - name: Test
      run: flutter test

    - name: Build web bundle
      run: flutter build web --release --dart-define=API_BASE_URL=https://back.nahalkmi.ir

    - name: Verify the production API URL was compiled in
      # Without the --dart-define the bundle silently points at http://localhost:5000
      # (lib/core/api/config/api_constants.dart) and every request fails in the browser.
      run: |
        grep -q 'back.nahalkmi.ir' build/web/main.dart.js
        ! grep -q 'localhost:5000' build/web/main.dart.js

    - name: Give the entry file a content-hashed name
      # Flutter names the whole app main.dart.js on every build, so a browser that cached it kept
      # running the old app after a deploy (production served it for 30 days). A new name per
      # build, referenced from the no-store bootstrap, reaches every browser at once.
      run: bash tool/cache_bust_web.sh build/web

    - name: Upload web bundle
      uses: actions/upload-artifact@v4
      with:
        name: provider-web
        path: booksy-provider-app/build/web
        retention-days: 7

  # Customer app (Flutter web), served by host nginx from /var/www/booksy-customer
  # on customer.nahalkmi.ir.
  build-customer-web:
    name: Build Customer App (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booksy-customer-app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        # Keep in step with the version the app is developed and verified on.
        flutter-version: '3.44.2'
        channel: stable
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze

    - name: Test
      run: flutter test

    - name: Build web bundle
      run: flutter build web --release --dart-define=API_BASE_URL=https://back.nahalkmi.ir

    - name: Verify the production API URL was compiled in
      # Without the --dart-define the bundle silently points at http://localhost:5000
      # (lib/core/api/config/api_constants.dart) and every request fails in the browser.
      run: |
        grep -q 'back.nahalkmi.ir' build/web/main.dart.js
        ! grep -q 'localhost:5000' build/web/main.dart.js

    - name: Give the entry file a content-hashed name
      run: bash tool/cache_bust_web.sh build/web

    - name: Upload web bundle
      uses: actions/upload-artifact@v4
      with:
        name: customer-web
        path: booksy-customer-app/build/web
        retention-days: 7

  # Admin panel (Vue), served by host nginx from /var/www/booksy-admin on admin.nahalkmi.ir.
  build-admin-web:
    name: Build Admin Panel (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booksy-admin

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: booksy-admin/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Unit tests
      run: npm run test:unit

    - name: Build
      env:
        VITE_API_BASE_URL: https://back.nahalkmi.ir/api/v1
      run: npm run build

    - name: Verify the production API URL was compiled in
      run: |
        grep -rq 'back.nahalkmi.ir' dist/assets
        ! grep -rq 'localhost:5000' dist/assets
        test -f dist/index.html

    - name: Upload web bundle
      uses: actions/upload-artifact@v4
      with:
        name: admin-web
        path: booksy-admin/dist
        retention-days: 7

  # Deploy on the production box itself, through a self-hosted runner installed there
  # (labels: self-hosted, booksy-prod; runs as the `booksy` user). GitHub-hosted runners cannot
  # reach this server's SSH at all -- its auth.log shows no connection from any of them --
  # so the old scp/ssh deploy could never work (openspec/changes/FOLLOW-UPS.md #59). The
  # runner only makes outbound connections to GitHub, which the box can do.
  #
  # This box is SHARED with unrelated services: touch only /opt/booksy, the booksy-* containers
  # and /var/www/booksy-provider. Never `docker image prune -a` or `docker system prune`.
  deploy:
    name: Deploy to Production Server
    runs-on: [self-hosted, booksy-prod]
    needs:
      - build-api
      - build-frontend
      - build-provider-web
      - build-customer-web
      - build-admin-web
    # Two pushes in quick succession must not interleave their compose operations.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://back.nahalkmi.ir
    env:
      DEPLOY_PATH: /opt/booksy
      PROVIDER_WEB_ROOT: /var/www/booksy-provider
      CUSTOMER_WEB_ROOT: /var/www/booksy-customer
      ADMIN_WEB_ROOT: /var/www/booksy-admin

    steps:
    - name: Checkout compose file
      uses: actions/checkout@v4
      with:
        sparse-checkout: docker-compose.prod.yml
        sparse-checkout-cone-mode: false

    - name: Install compose file
      run: |
        # .env lives only on the server (secrets); it is never shipped from the repo.
        if [ ! -f "$DEPLOY_PATH/.env" ]; then
          echo "::error::$DEPLOY_PATH/.env not found -- create it per docs/DEPLOYMENT_RUNBOOK.md"
          exit 1
        fi
        cp "$DEPLOY_PATH/docker-compose.prod.yml" "$DEPLOY_PATH/docker-compose.prod.yml.previous" 2>/dev/null || true
        cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"

    - name: Pull images and start the backend
      working-directory: /opt/booksy
      run: |
        # Only the two images CI just pushed; postgres/redis keep their pinned tags.
        # No --profile: Seq/pgAdmin stay off on this shared box.
        docker compose -f docker-compose.prod.yml pull booksy-api frontend
        # `up -d` recreates only containers whose image or config changed, so the
        # database and Redis keep running across a deploy.
        docker compose -f docker-compose.prod.yml up -d

    - name: Wait for the API container to become healthy
      run: |
        for i in $(seq 1 60); do
          status=$(docker inspect -f '{{.State.Health.Status}}' booksy-api 2>/dev/null || echo missing)
          if [ "$status" = "healthy" ]; then echo "booksy-api healthy after ~$((i*5))s"; exit 0; fi
          sleep 5
        done
        echo "::error::booksy-api did not become healthy (last status: $status)"
        docker logs --tail 200 booksy-api
        exit 1

    - name: Download provider web bundle
      uses: actions/download-artifact@v4
      with:
        name: provider-web
        path: provider-web

    - name: Publish provider web app
      run: |
        # Verify the new bundle BEFORE touching the live directory: an earlier manual deploy
        # emptied the site first and served 403 when the new files turned out to be missing.
        test -f provider-web/index.html
        # The entry file is content-hashed (tool/cache_bust_web.sh); the bootstrap must name it.
        entry=$(ls provider-web/main.dart.*.js | head -1)
        test -n "$entry"
        grep -q "\"mainJsPath\":\"$(basename "$entry")\"" provider-web/flutter_bootstrap.js
        rm -rf "${PROVIDER_WEB_ROOT:?}"/*
        cp -a provider-web/. "$PROVIDER_WEB_ROOT"/

    - name: Download customer web bundle
      uses: actions/download-artifact@v4
      with:
        name: customer-web
        path: customer-web

    - name: Publish customer app
      run: |
        # Same rule as the provider app: verify the new bundle before touching the live copy.
        test -f customer-web/index.html
        entry=$(ls customer-web/main.dart.*.js | head -1)
        test -n "$entry"
        grep -q "\"mainJsPath\":\"$(basename "$entry")\"" customer-web/flutter_bootstrap.js
        mkdir -p "${CUSTOMER_WEB_ROOT:?}"
        rm -rf "${CUSTOMER_WEB_ROOT:?}"/*
        cp -a customer-web/. "$CUSTOMER_WEB_ROOT"/

    - name: Download admin web bundle
      uses: actions/download-artifact@v4
      with:
        name: admin-web
        path: admin-web

    - name: Publish admin panel
      run: |
        # Same rule as the provider app: verify the new bundle before touching the live copy.
        test -f admin-web/index.html
        test -d admin-web/assets
        rm -rf "${ADMIN_WEB_ROOT:?}"/*
        cp -a admin-web/. "$ADMIN_WEB_ROOT"/

    - name: Health check (public URLs)
      run: |
        # Through the real domains: this box hosts other sites, and a request to the bare IP
        # lands on whichever vhost catches unmatched Host headers.
        check() {
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$1" || echo 000)
            if [ "$code" = "200" ]; then echo "$1 -> 200"; return 0; fi
            sleep 5
          done
          echo "::error::$1 returned $code"; return 1
        }
        check https://back.nahalkmi.ir/health
        check https://provider.nahalkmi.ir/
        check https://customer.nahalkmi.ir/
        check https://admin.nahalkmi.ir/

    - name: Remove dangling images
      if: always()
      # Dangling layers only (the images each deploy replaces). Never -a on a shared box.
      run: docker image prune -f

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
    - name: Deployment Success
      if: needs.deploy.result == 'success'
      run: |
        echo "Deployment to production completed successfully!"
        echo "Version: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"

    - name: Deployment Failed
      if: needs.deploy.result == 'failure'
      run: |
        echo "Deployment to production failed!"
        exit 1

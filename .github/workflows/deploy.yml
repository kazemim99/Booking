name: Deploy to Production

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './Booksy.sln'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/booksy

jobs:
  # Run all tests before deploying
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booksy_admin
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: booksy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksy_admin -d booksy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    - name: Run Unit Tests
      run: |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --configuration Release \
          --no-build \
          --filter "FullyQualifiedName~UnitTests" \
          --verbosity normal

    # Integration test projects still target the retired per-service hosts; re-enable
    # once they're retargeted to Booksy.Host (tracked in COMPLETION_ROADMAP Epic 3.1).
    # The keystone E2E job below covers the integration-level happy path in the meantime.
    # - name: Run Integration Tests
    #   env:
    #     ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=booksy_test;Username=booksy_admin;Password=TestPassword123!;Include Error Detail=true"
    #     ConnectionStrings__Redis: "localhost:6379"
    #   run: |
    #     dotnet test ${{ env.SOLUTION_PATH }} \
    #       --configuration Release \
    #       --no-build \
    #       --filter "FullyQualifiedName~IntegrationTests" \
    #       --verbosity normal

  # Keystone end-to-end smoke test: boot the real monolith host against ephemeral
  # Postgres+Redis and exercise the core flow (provider onboard → staff → customer
  # books) before building/​deploying to production.
  e2e-keystone:
    name: Keystone E2E Smoke
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: booksy_admin
          POSTGRES_PASSWORD: TestPassword123!
          POSTGRES_DB: booksy_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booksy_admin -d booksy_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Start Booksy host (sandbox auth, no real SMS)
      env:
        ASPNETCORE_ENVIRONMENT: Development
        ASPNETCORE_URLS: http://localhost:5050
        ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=booksy_e2e;Username=booksy_admin;Password=TestPassword123!;Include Error Detail=true"
        ConnectionStrings__Redis: "localhost:6379"
        EventBus__Provider: "InMemory"
        OTP_SANDBOX_CODE: "123456"
        Sms__SandboxMode: "true"
        # Program.cs defaults Database:SeedOnStartup to IsDevelopment() when unset, and this job
        # sets ASPNETCORE_ENVIRONMENT=Development -- so without this override the host reseeds
        # the full province/city reference dataset (thousands of rows) into a brand-new ephemeral
        # Postgres container on every run, which alone takes longer than the 240s health-check
        # window below. keystone-booking-flow.sh never reads that data (it posts plain city/state
        # strings, not seeded IDs), so there is nothing to lose by skipping it here.
        Database__SeedOnStartup: "false"
        # Same reason appsettings.Testing.json turns this off for the integration suite: the named
        # "otp"/"phone-verification" policies allow 5 requests per 300s, partitioned by caller IP —
        # and every call in CI comes from 127.0.0.1, so they all share one bucket. A clean run
        # spends 3 of those 5 on OTP logins; one retry would exhaust it and fail the job on a
        # 429 that has nothing to do with the booking flow this smoke test exists to prove.
        RateLimiting__Enabled: "false"
      run: |
        # --no-launch-profile is load-bearing: Properties/launchSettings.json pins
        # applicationUrl to http://localhost:5000, and `dotnet run` applies that launch profile
        # by default, overriding the ASPNETCORE_URLS=5050 set above. Without this flag the host
        # listens on 5000 while the health check below polls 5050, so the wait loop could never
        # succeed and this job always timed out after its full 240s.
        dotnet run --project src/Host/Booksy.Host/Booksy.Host.csproj --configuration Release --no-launch-profile > host.log 2>&1 &
        echo $! > host.pid

    - name: Wait for host to become healthy
      run: |
        for i in $(seq 1 80); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5050/health || echo 000)
          if [ "$code" = "200" ]; then echo "Host healthy after ~$((i*3))s"; exit 0; fi
          sleep 3
        done
        echo "Host did not become healthy in time"; tail -n 200 host.log; exit 1

    - name: Run keystone booking flow
      run: BASE=http://localhost:5050 bash tests/e2e/keystone-booking-flow.sh

    - name: Dump host log on failure
      if: failure()
      run: tail -n 300 host.log || true

  # Build the modular-monolith API (single image replacing usermanagement + servicecatalog + gateway)
  build-api:
    name: Build Booksy API (monolith)
    runs-on: ubuntu-latest
    needs: [test, e2e-keystone]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Booksy API
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./src/Host/Booksy.Host/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Build Frontend (parallel job 4)
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test, e2e-keystone]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: booksy-frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: booksy-frontend
      run: npm ci

    - name: Build frontend
      working-directory: booksy-frontend
      run: npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Build and push Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./booksy-frontend
        file: ./booksy-frontend/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ steps.meta.outputs.sha_short }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Deploy to Ubuntu server (waits for ALL build jobs)
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    needs:
      - build-api
      - build-frontend
    environment:
      name: production
      url: https://back.nahalkmi.ir

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create deployment package
      run: |
        mkdir -p deployment-package
        cp docker-compose.prod.yml deployment-package/
        cp -r deployment/scripts deployment-package/
        tar -czf deployment.tar.gz deployment-package/

    - name: Test SSH connectivity
      run: |
        echo "Testing connection to server..."
        timeout 30 nc -zv ${{ secrets.SERVER_HOST }} 22 || echo "Port 22 not reachable"

    - name: Copy deployment files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        source: "deployment.tar.gz"
        target: ${{ secrets.SERVER_DEPLOY_PATH }}
        timeout: 60s
        command_timeout: 10m

    - name: Deploy application on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: 22
        script: |
          set -e

          # Navigate to deployment directory
          cd ${{ secrets.SERVER_DEPLOY_PATH }}

          # Check if .env file exists
          if [ ! -f .env ]; then
            echo "ERROR: .env file not found at ${{ secrets.SERVER_DEPLOY_PATH }}/.env"
            echo "Please create the .env file following the deployment setup guide"
            exit 1
          fi

          # Backup existing .env file (in case deployment fails)
          cp .env .env.backup

          # Extract deployment files
          tar -xzf deployment.tar.gz

          # Copy docker-compose.prod.yml to main directory (but NOT .env)
          cp deployment-package/docker-compose.prod.yml .

          # Restore .env file (ensure it's not overwritten)
          # The .env should always come from the server, not from deployment package
          # cp .env.backup .env  # Only needed if deployment overwrites it

          # Login to GitHub Container Registry (the repo is public today so this is
          # not strictly required to pull, but keeps the deploy working unchanged if
          # the repo — or just the package visibility — ever goes private).
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Pull latest images. docker compose (v2 plugin), not the deprecated
          # docker-compose v1 binary — the server only has the plugin installed.
          # No --profile: Seq/pgAdmin stay off by default on this shared box (see
          # docker-compose.prod.yml's observability-profile comment).
          docker compose -f docker-compose.prod.yml pull

          # Force stop and remove any old booksy containers (including orphans from other deployments)
          echo "Cleaning up old containers..."
          docker ps -a --filter "name=booksy-" --format "{{.Names}}" | xargs -r docker rm -f || true

          # Stop old containers
          docker compose -f docker-compose.prod.yml down --remove-orphans

          # Start new containers with .env from main directory
          docker compose -f docker-compose.prod.yml up -d

          # Wait for services to be healthy
          sleep 10

          # Check service health
          docker compose -f docker-compose.prod.yml ps

          # Clean up old images
          docker image prune -af --filter "until=24h"

          # Clean up backup file
          rm -f .env.backup

          echo "Deployment completed successfully!"

    - name: Health check
      env:
        # Not secret (a public hostname), but kept as one env var so there's a
        # single place to change if the domain ever moves. This box hosts other
        # sites too, so the health check must go through the actual domain, not
        # the bare server IP — an IP request lands on whichever vhost catches
        # unmatched Host headers, which is a different site here, not Booksy.
        PUBLIC_DOMAIN: back.nahalkmi.ir
      run: |
        sleep 30
        response=$(curl -s -o /dev/null -w "%{http_code}" "https://${PUBLIC_DOMAIN}/health" || echo "000")
        if [ "$response" != "200" ]; then
          echo "Health check failed with status: $response"
          exit 1
        fi
        echo "Health check passed!"

  # Notify deployment status
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
    - name: Deployment Success
      if: needs.deploy.result == 'success'
      run: |
        echo "Deployment to production completed successfully!"
        echo "Version: ${{ github.sha }}"
        echo "Deployed by: ${{ github.actor }}"

    - name: Deployment Failed
      if: needs.deploy.result == 'failure'
      run: |
        echo "Deployment to production failed!"
        exit 1

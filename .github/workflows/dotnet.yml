name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "master", "develop", "claude/**" ]
  pull_request:
    branches: [ "master", "develop" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION_PATH: './AsanRezerve.sln'

jobs:
  # Job 1: Build + unit tests.
  # Build and test share a job so the test step can reuse the build output; running them as separate
  # jobs meant a fresh checkout with no artifacts, which is why the old commented-out jobs passed
  # `--no-build` and could never have worked.
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    # The filter selects by namespace: every unit project's tests live under *.UnitTests.*, the
    # architecture rules under *.ArchitectureTests.*. Two projects joined this tier in 2026-09
    # (AsanRezerve.ServiceCatalog.Api.UnitTests, AsanRezerve.Infrastructure.External.UnitTests) — ~105 tests
    # that used to sit inside the Docker-gated integration project and so never ran here.
    - name: Run unit tests
      run: >-
        dotnet test ${{ env.SOLUTION_PATH }}
        --configuration Release --no-build
        --filter "FullyQualifiedName~UnitTests|FullyQualifiedName~ArchitectureTests"
        --logger "trx;LogFileName=unit-tests.trx"
        --results-directory ./TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: ./TestResults
        retention-days: 7

  # Job 2: Dependency vulnerability gate.
  # The solution was brought to zero known advisories (5 HIGH + 2 moderate remediated). This job keeps
  # it there: any HIGH or CRITICAL advisory fails the build. Moderates are reported but not fatal, so a
  # newly-published moderate doesn't block unrelated work.
  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Scan for vulnerable packages
      run: |
        dotnet list ${{ env.SOLUTION_PATH }} package --vulnerable --include-transitive \
          > vulnerable.txt 2>&1 || true
        cat vulnerable.txt

        if grep -qE '\b(High|Critical)\b' vulnerable.txt; then
          echo "::error::HIGH or CRITICAL dependency advisory detected"
          grep -E '^\s+> ' vulnerable.txt | sort -u
          exit 1
        fi

        if grep -qE '\bModerate\b' vulnerable.txt; then
          echo "::warning::Moderate dependency advisories present (not blocking)"
          grep -E '^\s+> ' vulnerable.txt | sort -u
        fi

        echo "No HIGH or CRITICAL advisories."

  # Job 3: Integration tests. Enabled 2026-09-11 (docs/TEST_ARCHITECTURE_AUDIT.md Phase 1).
  #
  # The comment that stood here said the suite "does not currently pass" because it was written against
  # the retired per-service hosts. That was true when it was written and is not true now: the
  # ServiceCatalog suite was retargeted at AsanRezerve.Host in August, tests/known-failures.txt is empty, and
  # the last three FULL verifies were green at 513 + 42 + 21 tests. The strongest gate the project has
  # was running on developer machines only.
  #
  # No `services:` block: these suites start their own PostgreSQL through Testcontainers (one container
  # per test process, a database per test class), and ubuntu-latest ships a working Docker daemon. Redis
  # is not needed — the test hosts run with an in-memory cache.
  #
  # Build and test share a job so the test step can reuse the build output; a separate job would get a
  # fresh checkout with no artifacts, which is why the old commented-out jobs passed `--no-build` and
  # could never have worked.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Docker pulls + 60-odd host boots; the timeout is a guard against a hang, not a target.
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build solution
      run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

    # One project since docs/TEST_ARCHITECTURE_AUDIT.md Phase 2 slice 4 — Host composition,
    # ServiceCatalog and UserManagement each booted their own host in three separate projects;
    # now one host, one project.
    - name: Host integration tests
      run: >-
        dotnet test tests/AsanRezerve.Host.IntegrationTests
        --configuration Release --no-build
        --logger "trx;LogFileName=host-integration-tests.trx"
        --results-directory ./TestResults
        --blame-hang-timeout 5m

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-results
        path: ./TestResults
        retention-days: 7

  # Job 4: Architecture tests.
  #
  # These enforce ADR-005 (graph-attached children with domain-generated GUID keys must be
  # ValueGeneratedNever) and ADR-006 (a handler reaching a payment gateway must handle an
  # INonTransactionalCommand). Both rules had been documented and then violated repeatedly; the
  # ADR-006 rule found two live money defects the day it was written. They need no database — the EF
  # rule inspects the model, the money rule uses reflection — so they run in the build job.
  #
  # Included in the unit-test filter below via FullyQualifiedName~ArchitectureTests.

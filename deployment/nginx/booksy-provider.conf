# Booksy provider app (Flutter web, static build) on provider.nahalkmi.ir.
# Shared box: this vhost claims one server_name only and never touches the others.

server {
    listen 80;
    listen [::]:80;
    server_name provider.nahalkmi.ir;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name provider.nahalkmi.ir;

    ssl_certificate /etc/letsencrypt/live/provider.nahalkmi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/provider.nahalkmi.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/booksy-provider;
    index index.html;

    access_log /var/log/nginx/booksy_provider_access.log;
    error_log  /var/log/nginx/booksy_provider_error.log;

    # Flutter writes content-hashed asset names, so they are safe to cache hard.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm|json|bin|symbols)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # index.html and the service worker must NEVER be cached, or a deploy is invisible
    # to anyone who has already loaded the app once.
    location = /index.html            { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-store, must-revalidate"; }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

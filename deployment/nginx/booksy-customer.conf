# Booksy customer app (Flutter web, static build) on customer.nahalkmi.ir.
# Shared box: this vhost claims one server_name only and never touches the others.

server {
    listen 80;
    listen [::]:80;
    server_name customer.nahalkmi.ir;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name customer.nahalkmi.ir;

    ssl_certificate /etc/letsencrypt/live/customer.nahalkmi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/customer.nahalkmi.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/booksy-customer;
    index index.html;

    access_log /var/log/nginx/booksy_customer_access.log;
    error_log  /var/log/nginx/booksy_customer_error.log;

    # Flutter does NOT put a content hash in its file names. This block used to say it did and
    # cached every app file for 30 days, so browsers kept running an old build after each deploy
    # (2026-09-19: a user saw last week's services screen, in incognito). Now:
    #
    # - the app's entry file IS content-hashed, by CI (booksy-customer-app/tool/cache_bust_web.sh),
    #   so that one name can be cached for good — a new build is a new name;
    # - everything else is revalidated on each load. The ETag makes that a 304 when nothing changed,
    #   so it costs a round trip, not a download.
    #
    # add_header in a location drops the server-level ones, so they are repeated here.
    location ~* ^/main\.dart\.[0-9a-f]+\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm|json|bin|symbols)$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html and the service worker must NEVER be cached, or a deploy is invisible
    # to anyone who has already loaded the app once.
    location = /index.html            { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_service_worker.js { add_header Cache-Control "no-store, must-revalidate"; }
    location = /flutter_bootstrap.js  { add_header Cache-Control "no-store, must-revalidate"; }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# AsanRezerve admin panel (Vue, static build) on admin.nahalkmi.ir.
# Shared box: this vhost claims one server_name only and never touches the others.
#
# Issued like the provider vhost: the HTTP block below serves the ACME challenge first; the 443
# block is written only after the certificate exists (certbot turning a placeholder into a redirect
# loop is in the runbook's gotchas).

server {
    listen 80;
    listen [::]:80;
    server_name admin.nahalkmi.ir;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.nahalkmi.ir;

    ssl_certificate /etc/letsencrypt/live/admin.nahalkmi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.nahalkmi.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/asan-rezerve-admin;
    index index.html;

    access_log /var/log/nginx/asan_rezerve_admin_access.log;
    error_log  /var/log/nginx/asan_rezerve_admin_error.log;

    # Vite writes content-hashed names under /assets/ (index-z1lhu8Qr.js), so these are safe to
    # cache for good — unlike Flutter's fixed names (see the provider vhost).
    # add_header here drops the server-level ones, so they are repeated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html names the current hashed bundle: never cache it, or a deploy is invisible.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # SPA routing: unknown paths are client-side routes, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

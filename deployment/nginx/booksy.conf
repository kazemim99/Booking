# Nginx vhost for Booksy on back.nahalkmi.ir.
#
# This box is shared with other sites/services (see their own sites-available files —
# do not touch those). This vhost only claims the single server_name below, so it never
# competes with anything else's Host-header routing.
#
# Everything goes to the frontend container (127.0.0.1:8081): its own nginx.conf already
# proxies /api/ to booksy-api over the Docker network, so this vhost needs only one
# upstream. Seq (/logs/) and pgAdmin (/pgadmin/) are only reachable if the optional
# `observability` Compose profile is running (docker-compose.prod.yml) — harmless 502s
# otherwise.

server {
    listen 80;
    listen [::]:80;
    server_name back.nahalkmi.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name back.nahalkmi.ir;

    ssl_certificate /etc/letsencrypt/live/back.nahalkmi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/back.nahalkmi.ir/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/booksy_access.log;
    error_log /var/log/nginx/booksy_error.log;

    client_max_body_size 32M;

    # Frontend (SPA) + /api/ (the frontend container's own nginx forwards /api/ to
    # booksy-api:80 over booksy-network — this vhost only ever talks to one upstream).
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Seq — only up when the observability profile is running.
    location /logs/ {
        proxy_pass http://127.0.0.1:5341/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # pgAdmin — only up when the observability profile is running.
    location /pgadmin/ {
        proxy_pass http://127.0.0.1:5050/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

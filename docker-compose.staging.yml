version: '3.8'

# Staging Environment Configuration
# Similar to production but with different ports and resource limits

services:
  # Backend — modular monolith (replaces usermanagement + servicecatalog + gateway)
  asan-rezerve-api-staging:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/asan-rezerve-api:${STAGING_TAG:-develop}
    container_name: asan-rezerve-api-staging
    env_file:
      - .env.staging
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING_STAGING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING_STAGING}
      # CAP runs in-process; no RabbitMQ broker required.
      - EventBus__Provider=InMemory
      - Seq__ServerUrl=${SEQ_SERVER_URL_STAGING}
    ports:
      - "6000:80"
    depends_on:
      postgres-staging:
        condition: service_healthy
      redis-staging:
        condition: service_healthy
    networks:
      - asan-rezerve-staging-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  frontend-staging:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/asan-rezerve-frontend:${STAGING_TAG:-develop}
    container_name: asan-rezerve-frontend-staging
    env_file:
      - .env.staging
    ports:
      - "8080:80"
    depends_on:
      - asan-rezerve-api-staging
    networks:
      - asan-rezerve-staging-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Infrastructure Services
  postgres-staging:
    image: postgres:16-alpine
    container_name: asan-rezerve-postgres-staging
    env_file:
      - .env.staging
    environment:
      - POSTGRES_USER=${POSTGRES_USER_STAGING:-asan_rezerve_staging}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD_STAGING}
      - POSTGRES_DB=${POSTGRES_DB_STAGING:-asan_rezerve_staging}
    ports:
      - "127.0.0.1:6432:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    networks:
      - asan-rezerve-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER_STAGING:-asan_rezerve_staging} -d ${POSTGRES_DB_STAGING:-asan_rezerve_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-staging:
    image: redis:7-alpine
    container_name: asan-rezerve-redis-staging
    env_file:
      - .env.staging
    command: redis-server --requirepass ${REDIS_PASSWORD_STAGING} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - asan-rezerve-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  seq-staging:
    image: datalust/seq:latest
    container_name: asan-rezerve-seq-staging
    env_file:
      - .env.staging
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USER_STAGING:-admin}
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD_STAGING}
    ports:
      - "6341:80"
    volumes:
      - seq_staging_data:/data
    networks:
      - asan-rezerve-staging-network
    restart: unless-stopped

volumes:
  postgres_staging_data:
    driver: local
  redis_staging_data:
    driver: local
  seq_staging_data:
    driver: local

networks:
  asan-rezerve-staging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/16

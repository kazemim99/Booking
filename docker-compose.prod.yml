services:
  # Backend — modular monolith (UserManagement + ServiceCatalog in one host).
  # Replaces the former usermanagement-api + servicecatalog-api + gateway services.
  booksy-api:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/booksy-api:latest
    container_name: booksy-api
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      # CAP runs in-process; no RabbitMQ broker required.
      - EventBus__Provider=InMemory
      # Serilog's Seq sink buffers and retries silently if unreachable — safe to point
      # at a Seq that isn't running when the observability profile is off (see below).
      - Seq__ServerUrl=${SEQ_SERVER_URL:-http://seq:5341}
    ports:
      # Localhost only: the frontend container reaches this over booksy-network by
      # container name, and the host nginx vhost never needs to — it proxies to the
      # frontend container, whose own nginx forwards /api/ internally. This binding
      # exists only for operator debugging (curl/Swagger from the box itself).
      - "127.0.0.1:5000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # No hard dependency on seq: it's off by default on this box (lean profile,
      # shared with other services on limited RAM — see the observability profile
      # below). A hard `service_started` dependency would block booksy-api from
      # starting at all whenever seq isn't deployed.
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        # Sized for a shared box (2 vCPU / ~3.8GB RAM total, already running other
        # services) rather than a dedicated host — see docs/DEPLOYMENT_RUNBOOK.md.
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/booksy-frontend:latest
    container_name: booksy-frontend
    env_file:
      - .env
    ports:
      # Localhost only, no 443: TLS terminates at the HOST's nginx (shared with
      # other sites on this box), which reverse-proxies to this port. The
      # container never binds 80/443 directly — those already belong to the
      # host nginx serving other domains. See deployment/nginx/booksy.conf.
      - "127.0.0.1:8081:80"
    depends_on:
      booksy-api:
        condition: service_started
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Infrastructure Services
  postgres:
    image: postgres:16-alpine
    container_name: booksy-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    ports:
      - "127.0.0.1:5432:5432"  # Only bind to localhost for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 640M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: booksy-redis
    env_file:
      - .env
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 192mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost for security
    volumes:
      - redis_data:/data
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # RabbitMQ removed: CAP runs on its in-memory transport inside the monolith host.

  # Seq and pgAdmin are OFF by default on this box: it's shared with other services on
  # limited RAM (~3.8GB total), and neither is required for the app to run — Serilog's
  # Seq sink degrades gracefully when unreachable, and Postgres can be inspected over
  # an SSH tunnel with a local pgAdmin/DBeaver instead. Start them explicitly with
  # `docker compose --profile observability up -d` if there's headroom later.
  seq:
    image: datalust/seq:latest
    container_name: booksy-seq
    profiles: ["observability"]
    env_file:
      - .env
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINUSERNAME=${SEQ_ADMIN_USER}
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5341:80"       # Seq UI — reach it via an SSH tunnel, never public
      - "127.0.0.1:5342:5341"     # Seq ingestion (booksy-api reaches it over booksy-network directly; this port is for external shippers only)
    volumes:
      - seq_data:/data
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    # healthcheck disabled: seq doesn't return successful /api/health responses
    # healthcheck:
    #   test: ["CMD-SHELL", "curl -f http://localhost/api/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 20s

  # pgAdmin for database management — see the observability-profile note above seq.
  pgadmin:
    image: dpage/pgadmin4
    container_name: booksy-pgadmin
    profiles: ["observability"]
    env_file:
      - .env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@booksy.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "127.0.0.1:5050:80"  # Localhost only — reach it via an SSH tunnel, never public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - booksy-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  seq_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  booksy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

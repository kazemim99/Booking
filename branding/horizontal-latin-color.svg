<svg xmlns="http://www.w3.org/2000/svg" width="380" height="100" viewBox="0 0 380 100" fill="none">
  <!-- AsanRezerve — Horizontal Lockup — Latin — Color on White -->
  <!-- Font: Vazirmatn (https://fonts.google.com/specimen/Vazirmatn) — install for offline use -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <!-- Symbol mark (100×100 internal grid scaled to 80×80 at position 10,10) -->
  <svg x="10" y="10" width="80" height="80" viewBox="0 0 100 100" fill="none">
    <line x1="50" y1="13" x2="14" y2="83" stroke="#3777C0" stroke-width="8.5" stroke-linecap="round"/>
    <line x1="50" y1="13" x2="86" y2="83" stroke="#3777C0" stroke-width="8.5" stroke-linecap="round"/>
    <polyline points="32,48 54,70 82,25" stroke="#0AC075" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>

  <!-- Brand name -->
  <text x="110" y="54" font-family="Vazirmatn, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.7">
    <tspan fill="#3777C0">Asan</tspan><tspan fill="#0F1724">Rezerve</tspan>
  </text>

  <!-- Tagline -->
  <text x="111" y="72" font-family="Vazirmatn, sans-serif" font-size="11" font-weight="400" fill="#6B7280" letter-spacing="0.7">ONLINE BOOKING PLATFORM</text>
</svg>
